<!DOCTYPE html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b6e8a"><title>גלעדיקה</title>
<style>
:root{--bg:#f2f8fa;--card:#fff;--ink:#17323b;--mut:#5d7a85;--pri:#0b6e8a;--pri2:#e0f1f6;--ok:#1e8e4e;--okbg:#e5f6ec;--warn:#b86e00;--warnbg:#fff4de;--line:#d3e3e9}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:18px;line-height:1.5;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 80px}
h1{font-size:28px;margin:6px 0}h2{font-size:21px;margin:8px 0}
.top{display:flex;align-items:center;justify-content:space-between}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font-size:19px;font-weight:700;background:var(--pri);color:#fff;cursor:pointer;margin:10px 0;font-family:inherit}
.btn.sec{background:var(--pri2);color:var(--pri)}.btn.big{padding:20px;font-size:23px}
.btn:disabled{opacity:.45}
.set{display:flex;gap:10px;align-items:center;width:100%;text-align:right;border:1px solid var(--line);background:#fff;border-radius:14px;padding:11px 12px;margin:7px 0;font-size:17px;font-family:inherit;color:var(--ink);cursor:pointer}
.set .no{min-width:38px;height:38px;border-radius:50%;background:var(--pri2);color:var(--pri);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
.set.done .no{background:var(--okbg);color:var(--ok)}.set.next{border:2px solid var(--pri)}
.set small{display:block;color:var(--mut);font-size:14px}.tag{margin-inline-start:auto;font-size:13px;color:#fff;background:var(--pri);border-radius:8px;padding:2px 8px}
.sec-h{font-size:15px;color:var(--mut);margin:16px 4px 2px;font-weight:700}
.prog{height:10px;background:var(--pri2);border-radius:8px;overflow:hidden;margin:8px 0}.prog i{display:block;height:100%;background:var(--pri);transition:width .3s}
.q{font-size:21px;margin:8px 0 14px}
.box{background:var(--pri2);border-radius:12px;padding:10px 12px;margin:10px 0}
.msg{border-radius:12px;padding:10px 12px;margin:10px 0}.msg.ok{background:var(--okbg);color:#14663a}.msg.no{background:var(--warnbg);color:var(--warn)}
input.in{font-size:24px;width:100%;padding:12px;border:2px solid var(--line);border-radius:12px;text-align:center;direction:ltr;font-family:inherit}
input.sm{width:72px;font-size:24px;padding:10px 4px;border:2px solid var(--line);border-radius:10px;text-align:center;direction:ltr}
.ans{display:flex;align-items:center;justify-content:center;gap:12px;direction:ltr;margin:6px 0}
.opt{display:block;width:100%;margin:8px 0;padding:14px;border:2px solid var(--line);background:#fff;border-radius:12px;font-size:21px;font-family:inherit;cursor:pointer;color:var(--ink)}
.opt.sel{border-color:var(--pri);background:var(--pri2)}
.m{display:inline-block;direction:ltr;unicode-bidi:isolate;white-space:nowrap}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.15;margin:0 3px;font-size:.95em}
.fr b{font-weight:600;padding:0 4px}.fr i{display:block;width:100%;height:2px;background:currentColor}
.mx{display:inline-flex;align-items:center;gap:2px;vertical-align:middle}.mx u{text-decoration:none;font-size:1.2em}
.fish{font-size:64px;text-align:center}.grid{display:flex;flex-wrap:wrap;gap:6px;font-size:30px}
.lnk{background:none;border:0;color:var(--pri);font-size:16px;text-decoration:underline;cursor:pointer;font-family:inherit}
.row{display:flex;gap:8px}.row .btn{margin:6px 0}
textarea{width:100%;height:90px;font-family:inherit;border:1px solid var(--line);border-radius:10px;padding:8px;font-size:14px;direction:ltr}
</style></head><body><div class="wrap" id="app"></div>
<script>
// ---------- question generators (shared by app and answer-key export) ----------
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function gcd(a,b){return b?gcd(b,a%b):a}
function mk(seed){const r=mulberry32(seed);const R={ri:(a,b)=>a+Math.floor(r()*(b-a+1)),pick:a=>a[Math.floor(r()*a.length)]};R.shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};return R}
const fmt=x=>String(Number(Number(x).toFixed(6)));
const M=s=>'<span class="m" dir="ltr">'+s+'</span>';
const F=(n,d)=>'<span class="fr" dir="ltr"><b>'+n+'</b><i></i><b>'+d+'</b></span>';
const MX=(w,n,d)=>'<span class="mx" dir="ltr"><u>'+w+'</u>'+F(n,d)+'</span>';
const T=(a,b)=>fmt(a)+' '+b;
const things=['עוגיות','כדורים','קלפים','מדבקות','גולות','בלונים'];
function num(t,a,h,e){return{k:'num',t,a,h,e}}
function frac(t,n,d,h,e){return{k:'frac',t,a:[n,d],h,e}}
function mix(t,w,n,d,h,e){return{k:'mix',t,a:[w,n,d],h,e}}
function ch(t,opts,ai,h,e){return{k:'ch',t,opts,a:ai,h,e}}
function shuf(R,right,wrong){const o=R.shuffle([right].concat(wrong));return[o,o.indexOf(right)]}
// builders
const B={
digitVal(R,lv){const w=R.ri(1,9);let t=R.ri(1,9),h=lv?R.ri(1,9):0;const n=lv?w+'.'+t+h:w+'.'+t;const place=lv?R.pick(['t','h']):'t';
 const d=place==='t'?t:h;const val=place==='t'?d/10:d/100;const nm=place==='t'?'עשיריות':'מאיות';
 const [o,i]=shuf(R,fmt(val),[String(d),fmt(d*10),fmt(place==='t'?d/100:d/10)].filter((x,ix,ar)=>ar.indexOf(x)===ix&&x!==fmt(val)));
 return ch('מה ערך הספרה '+d+' במספר '+M(n)+'?',o,i,'הספרה '+d+' נמצאת במקום ה'+nm+'.','הספרה '+d+' נמצאת במקום ה'+nm+', לכן הערך שלה הוא '+M(fmt(val))+'.')},
compose(R,lv){const w=R.ri(1,9),t=R.ri(1,9);if(!lv)return num('כתוב כמספר עשרוני: '+w+' שלמים ו-'+t+' עשיריות',+(w+'.'+t),'השלמים לפני הנקודה, העשיריות אחריה.',M(w+'.'+t));
 const h=R.ri(1,9);return num('כתוב כמספר עשרוני: '+w+' שלמים, '+t+' עשיריות ו-'+h+' מאיות',+(w+'.'+t+h),'אחרי הנקודה: קודם עשיריות ואז מאיות.',M(w+'.'+t+h))},
cmp(R,lv){let a,b;if(lv===0){const w=R.ri(1,9);a=w+'.'+R.ri(1,4);b=w+'.'+R.ri(5,9)}else if(lv===1){a=R.ri(1,5)+'.'+R.ri(1,9);b=R.ri(6,9)+'.'+R.ri(1,9)}else{const w=R.ri(1,9);const x=R.ri(1,9);a=w+'.'+x;b=w+'.'+R.ri(0,x-1<0?0:x-1)+R.ri(1,9);if(+b>=+a)b=w+'.0'+R.ri(1,9)}
 const g=Math.max(+a,+b);const [o,i]=shuf(R,fmt(g),[fmt(Math.min(+a,+b))]);return ch('איזה מספר גדול יותר?',o,i,'משווים קודם את השלמים, אחר כך את העשיריות.',M(a)+' ו-'+M(b)+': הגדול הוא '+M(fmt(g))+'. משווים ספרה ספרה מהשמאל.')},
addDec(R,lv){let a,b,op='+';if(lv===0){a=R.ri(11,49)/10;b=R.ri(11,49)/10;while(((a*10)%10)+((b*10)%10)>=10){b=R.ri(11,49)/10}}else if(lv===1){a=R.ri(30,99)/10;b=R.ri(11,29)/10;op='-'}else{a=R.ri(120,990)/100;b=R.ri(110,290)/100;op=R.pick(['+','-'])}
 const r=op==='+'?a+b:a-b;return num('חשב: '+M(fmt(a)+' '+op+' '+fmt(b)),Math.round(r*100)/100,'כותבים בטור, נקודה מתחת לנקודה.','כותבים בטור כך שהנקודות אחת מתחת לשנייה. התוצאה: '+M(fmt(r)))},
tenp(R,lv){const n=R.pick([3.4,2.5,0.7,1.2,4.6,5.1,0.36,2.75,6.04]);const op=lv===0?R.pick(['*10','/10']):R.pick(['*100','/100','*1000','/10','*10']);const k=+op.slice(1);const r=op[0]==='*'?n*k:n/k;
 return num('חשב: '+M(fmt(n)+' '+(op[0]==='*'?'×':'÷')+' '+k),Math.round(r*1e6)/1e6,'כפל ב-10 מזיז את הנקודה ימינה, חילוק ב-10 מזיז שמאלה. כל אפס הוא צעד אחד.','כל אפס ב-'+k+' מזיז את הנקודה צעד אחד '+(op[0]==='*'?'ימינה':'שמאלה')+': '+M(fmt(r)))},
mul(R,lv){let a,b;if(lv===0){a=R.ri(11,24);b=R.ri(2,4)}else if(lv===1){a=R.ri(25,69);b=R.ri(3,8)}else if(lv===2){a=R.ri(12,35);b=R.ri(11,29)}else if(lv===3){a=R.ri(101,399);b=R.ri(12,29)}else{a=R.ri(1100,3499);b=R.ri(102,303)}
 return num('חשב: '+M(a+' × '+b),a*b,'כתוב בטור. כפול קודם את ספרת האחדות, אחר כך העשרות (שורה חדשה, מתחילים באפס), ובסוף חבר.','פותרים בטור: מכפילים כל ספרה, מחברים את השורות. '+M(a+' × '+b+' = '+(a*b)))},
div(R,lv){let d,q;if(lv===0){d=R.ri(2,5);q=R.ri(12,40)}else if(lv===1){d=R.ri(3,9);q=R.ri(40,190)}else if(lv===2){d=R.ri(11,19);q=R.ri(11,29)}else if(lv===3){d=R.ri(12,29);q=R.ri(30,99)}else{d=R.ri(12,29);q=R.ri(120,320)}
 return num('חשב: '+M((d*q)+' ÷ '+d),q,'חילוק ארוך: כמה פעמים '+d+' נכנס בספרות הראשונות? כתוב, הכפל, החסר, והורד ספרה.','בודקים בכפל: '+M(q+' × '+d+' = '+(d*q))+'. לכן '+M((d*q)+' ÷ '+d+' = '+q))},
share(R,lv){const d=R.ri(2,6),q=R.ri(lv?5:3,lv?12:8);const th=R.pick(things);return num(d+' ילדים מחלקים '+(d*q)+' '+th+' שווה בשווה. כמה '+th+' מקבל כל ילד?',q,'חילוק: '+M((d*q)+' ÷ '+d),'כל ילד מקבל '+M((d*q)+' ÷ '+d+' = '+q))},
pizza1(R,lv){const n=lv===0?R.ri(2,4):lv===1?R.ri(5,8):R.ri(9,12);return frac('מחלקים פיצה אחת שווה בשווה ל-'+n+' ילדים. איזה חלק מהפיצה מקבל כל ילד?',1,n,'מחלקים ל-'+n+' חלקים שווים. כל ילד מקבל חלק אחד מתוך '+n+'.','כל ילד מקבל חלק אחד מתוך '+n+': '+F(1,n)+'. כלומר '+M('1 ÷ '+n+' = ')+F(1,n))},
quot(R,lv){const b=R.ri(3,lv?12:7),a=R.ri(1,b-1);return frac('כתוב את תוצאת החילוק כשבר: '+M(a+' ÷ '+b),a,b,'המחולק (המספר הראשון) הוא המונה למעלה, המחלק הוא המכנה למטה.',M(a+' ÷ '+b+' = ')+F(a,b)+'. המספר הראשון למעלה והשני למטה.')},
readQ(R,lv){const b=R.ri(3,9),a=R.ri(1,b-1);const right=M(a+' ÷ '+b),[o,i]=shuf(R,right,[M(b+' ÷ '+a),M(a+' × '+b),M(a+' - '+b)]);return ch('השבר '+F(a,b)+' שווה לתוצאה של איזה חילוק?',o,i,'שבר הוא חילוק: המונה למעלה מחולק במכנה.',F(a,b)+' = '+M(a+' ÷ '+b))},
story(R,lv){const b=R.ri(3,8),a=R.ri(2,b-1);const th=R.pick(['פיצות','שוקולדים','עוגות','לחמניות']);return frac(a+' '+th+' מחולקות שווה בשווה ל-'+b+' ילדים. איזה חלק משלם מקבל כל ילד?',a,b,'מחלקים '+a+' ב-'+b+' וכותבים כשבר.',M(a+' ÷ '+b+' = ')+F(a,b)+'. כל ילד מקבל '+F(a,b)+' משלם.')},
big(R,lv){const b=R.ri(2,6),a=b*R.ri(1,2)+R.ri(1,b-1);const th=R.pick(['ליטר מים','ק"ג תפוחים','מטר חבל']);return frac(a+' '+th+' מחולקים שווה בשווה ל-'+b+' כלים. כמה בכל כלי? כתוב כשבר',a,b,'גם כשהמונה גדול מהמכנה כותבים: מחולק למעלה, מחלק למטה.',M(a+' ÷ '+b+' = ')+F(a,b)+'. השבר גדול מ-1 וזה בסדר גמור.')},
toMix(R,lv){const b=R.ri(2,6),w=R.ri(1,4),r=R.ri(1,b-1);const a=w*b+r;return mix('כתוב את '+F(a,b)+' כמספר מעורב',w,r,b,'כמה פעמים '+b+' נכנס ב-'+a+'? זה מספר השלמים. מה שנשאר הוא המונה.',F(a,b)+' = '+M(a+' ÷ '+b)+': יוצא '+w+' ושארית '+r+'. לכן '+MX(w,r,b))},
toImp(R,lv){const b=R.ri(2,6),w=R.ri(1,4),r=R.ri(1,b-1);return frac('כתוב את '+MX(w,r,b)+' כשבר',w*b+r,b,'כפול את השלמים במכנה והוסף את המונה: '+M(w+' × '+b+' + '+r),MX(w,r,b)+': '+M(w+' × '+b+' + '+r+' = '+(w*b+r))+', ולכן '+F(w*b+r,b))},
rem(R,lv){const b=R.ri(3,9),w=R.ri(1,lv?9:4),r=R.ri(1,b-1);const a=w*b+r;return mix('חשב '+M(a+' ÷ '+b)+' וכתוב את התוצאה כמספר מעורב',w,r,b,'קודם חילוק רגיל עם שארית. השארית הולכת למעלה, המחלק למטה.',M(a+' ÷ '+b)+': '+w+' ושארית '+r+'. תוצאה: '+MX(w,r,b))},
f2d(R,lv){const L=lv===0?[[1,2,.5],[1,10,.1],[3,10,.3],[1,4,.25],[3,4,.75],[1,5,.2]]:[[2,5,.4],[4,5,.8],[7,10,.7],[9,20,.45],[3,20,.15],[7,25,.28],[1,8,.125],[13,20,.65]];const x=R.pick(L);
 return num('כתוב כמספר עשרוני: '+F(x[0],x[1]),x[2],'חילוק: '+M(x[0]+' ÷ '+x[1])+'. או הרחב את המכנה ל-10 או ל-100.',F(x[0],x[1])+' = '+M(x[0]+' ÷ '+x[1]+' = '+fmt(x[2])))},
d2f(R,lv){const L=lv===0?[[.5,1,2],[.3,3,10],[.7,7,10],[.25,1,4],[.2,1,5],[.9,9,10]]:[[.75,3,4],[.6,3,5],[.4,2,5],[.35,7,20],[.45,9,20],[.8,4,5],[.15,3,20],[.04,1,25]];const x=R.pick(L);
 return frac('כתוב כשבר: '+M(fmt(x[0]))+' (אפשר גם בלי לצמצם)',x[1],x[2],'עשיריות: מכנה 10. מאיות: מכנה 100. אחר כך אפשר לצמצם.',M(fmt(x[0]))+' = '+F(x[1],x[2])+' אחרי צמצום.')},
part(R,lv){const d=R.pick(lv?[3,4,5,6,8]:[2,4,5,10]),n=lv?R.ri(2,d-1):1,q=R.ri(2,lv?9:5)*d;return num('כמה זה '+F(n,d)+' מתוך '+M(q)+'.',q/d*n,'מחלקים ב-'+d+' ומכפילים ב-'+n+'.','מחלקים: '+M(q+' ÷ '+d+' = '+(q/d))+(n>1?' ומכפילים ב-'+n+': '+M(q/d*n):''))},
word2(R,lv){const b=R.pick([2,4,5]);let a;do{a=R.ri(b+1,3*b)}while(a%b===0);const c=R.pick([['מטר חבל נחתכים','חלקים שווים','מטר בכל חלק'],['ק"ג קמח נארזים','שקיות שוות','ק"ג בכל שקית'],['ליטר מיץ מחולקים','כוסות שוות','ליטר בכל כוס']]);return num(a+' '+c[0]+' ל-'+b+' '+c[1]+'. כמה '+c[2]+'? כתוב כמספר עשרוני',a/b,'חילוק: '+M(a+' ÷ '+b),M(a+' ÷ '+b+' = '+fmt(a/b)))},
word3(R,lv){const b=R.ri(3,7),w=R.ri(1,3),r=R.ri(1,b-1),a=w*b+r;return mix(a+' ק"ג תפוחים מחולקים ל-'+b+' שקיות שוות. כמה ק"ג בכל שקית? כתוב כמספר מעורב',w,r,b,'חילוק עם שארית: השארית הולכת למעלה.',M(a+' ÷ '+b)+' = '+MX(w,r,b))}
};
// ---------- sets ----------
const seq=(...a)=>a;
const SETS=[
{id:'A1',tr:'A',n:'עשרוניים: ערך הספרה',i:'<p>מספר עשרוני יש לו נקודה. מה שלפני הנקודה הם שלמים. אחרי הנקודה: קודם <b>עשיריות</b> ואז <b>מאיות</b>.</p><p>דוגמה: '+M('3.47')+' הם 3 שלמים, 4 עשיריות ו-7 מאיות.</p>',g:(R)=>[B.compose(R,0),B.compose(R,0),B.digitVal(R,0),B.digitVal(R,0),B.compose(R,1),B.digitVal(R,1),B.compose(R,1),B.digitVal(R,1)]},
{id:'A2',tr:'A',n:'מי גדול יותר',i:'<p>כדי להשוות שני מספרים עשרוניים מסתכלים קודם על השלמים. אם הם שווים, משווים עשיריות. אם גם הן שוות, משווים מאיות.</p><p>דוגמה: '+M('2.7')+' גדול מ-'+M('2.3')+' כי 7 עשיריות יותר מ-3 עשיריות.</p>',g:(R)=>[B.cmp(R,0),B.cmp(R,0),B.cmp(R,0),B.cmp(R,1),B.cmp(R,1),B.cmp(R,1),B.cmp(R,2),B.cmp(R,2)]},
