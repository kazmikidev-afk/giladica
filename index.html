<!DOCTYPE html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache"><meta name="theme-color" content="#0b6e8a"><title>גלעדיקה</title>
<style>
:root{--bg:#f2f8fa;--card:#fff;--ink:#17323b;--mut:#5d7a85;--pri:#0b6e8a;--pri2:#e0f1f6;--ok:#1e8e4e;--okbg:#e5f6ec;--warn:#b86e00;--warnbg:#fff4de;--line:#d3e3e9}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:18px;line-height:1.5;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 80px}
h1{font-size:28px;margin:6px 0}h2{font-size:21px;margin:8px 0}
.top{display:flex;align-items:center;justify-content:space-between}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font-size:19px;font-weight:700;background:var(--pri);color:#fff;cursor:pointer;margin:10px 0;font-family:inherit}
.btn.sec{background:var(--pri2);color:var(--pri)}.btn.big{padding:20px;font-size:23px}
.btn:disabled{opacity:.45}
.set{display:flex;gap:10px;align-items:center;width:100%;text-align:right;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:11px 12px;margin:7px 0;font-size:17px;font-family:inherit;color:var(--ink);cursor:pointer}
.set .no{min-width:38px;height:38px;border-radius:50%;background:var(--pri2);color:var(--pri);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
.set.done .no{background:var(--okbg);color:var(--ok)}.set.next{border:2px solid var(--pri)}
.set small{display:block;color:var(--mut);font-size:14px}.tag{margin-inline-start:auto;font-size:13px;color:#fff;background:var(--pri);border-radius:8px;padding:2px 8px}
.sec-h{font-size:15px;color:var(--mut);margin:16px 4px 2px;font-weight:700}
.prog{height:10px;background:var(--pri2);border-radius:8px;overflow:hidden;margin:8px 0}.prog i{display:block;height:100%;background:var(--pri);transition:width .3s}
.q{font-size:21px;margin:8px 0 14px}
.box{background:var(--pri2);border-radius:12px;padding:10px 12px;margin:10px 0}
.msg{border-radius:12px;padding:10px 12px;margin:10px 0}.msg.ok{background:var(--okbg);color:#14663a}.msg.no{background:var(--warnbg);color:var(--warn)}
input.in{font-size:24px;width:100%;padding:12px;border:2px solid var(--line);border-radius:12px;text-align:center;direction:ltr;font-family:inherit;background:var(--card);color:var(--ink)}
input.sm{width:72px;font-size:24px;padding:10px 4px;border:2px solid var(--line);border-radius:10px;text-align:center;direction:ltr;background:var(--card);color:var(--ink)}
.ans{display:flex;align-items:center;justify-content:center;gap:12px;direction:ltr;margin:6px 0}
.opt{display:block;width:100%;margin:8px 0;padding:14px;border:2px solid var(--line);background:var(--card);border-radius:12px;font-size:21px;font-family:inherit;cursor:pointer;color:var(--ink)}
.opt.sel{border-color:var(--pri);background:var(--pri2)}
.m{display:inline-block;direction:ltr;unicode-bidi:isolate;white-space:nowrap}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.15;margin:0 3px;font-size:.95em}
.fr b{font-weight:600;padding:0 4px}.fr i{display:block;width:100%;height:2px;background:currentColor}
.mx{display:inline-flex;align-items:center;gap:2px;vertical-align:middle}.mx u{text-decoration:none;font-size:1.2em}
.fish{font-size:64px;text-align:center}.grid{display:flex;flex-wrap:wrap;gap:6px;font-size:30px}
.lnk{background:none;border:0;color:var(--pri);font-size:16px;text-decoration:underline;cursor:pointer;font-family:inherit}
.toolrow{display:flex;gap:8px;margin:10px 0}
.tbtn{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:12px 6px;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer}
[data-theme=dark]{--bg:#10191e;--card:#1a272d;--ink:#e3eef2;--mut:#8ba6b0;--pri:#4fc3e3;--pri2:#153039;--ok:#4cc38a;--okbg:#123528;--warn:#e0a458;--warnbg:#3a2c12;--line:#2b414a}
.row{display:flex;gap:8px}.row .btn{margin:6px 0}
textarea{width:100%;height:90px;font-family:inherit;border:1px solid var(--line);border-radius:10px;padding:8px;font-size:14px;direction:ltr;background:var(--card);color:var(--ink)}
#prt{position:fixed;inset:0;z-index:99999;background:#fff;color:#000;overflow:auto;direction:rtl;font-family:inherit}
#prt .pbar{position:sticky;top:0;background:#eef6f9;padding:10px;border-bottom:1px solid #9bb;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
#prt .pbar .btn{width:auto;margin:0;padding:8px 14px;font-size:16px}
#prt .pn2{font-size:13px;color:#345;width:100%}
#prt .ps{max-width:780px;margin:0 auto;padding:18px;font-size:18px;line-height:1.5}
#prt[data-mode=q] .pas,#prt[data-mode=a] .pqs{display:none}
#prt h1{font-size:24px;margin:0 0 6px;color:#000}
#prt .pm{margin:10px 0;font-size:17px}#prt .pt{font-size:14px;margin-bottom:12px;color:#222}
#prt .pq{display:flex;gap:10px;margin:0 0 6px;padding:8px 0;border-bottom:1px dotted #888;break-inside:avoid;page-break-inside:avoid}
#prt .pn{font-weight:800;min-width:28px;font-size:19px}
#prt .pb{flex:1}#prt .q{font-size:18px;color:#000}
#prt .po{display:flex;flex-wrap:wrap;gap:4px 22px;margin-top:6px}
#prt .pl{display:flex;align-items:center;gap:8px;margin-top:8px}
#prt .ln{display:inline-block;width:150px;border-bottom:1.5px solid #000;height:22px}#prt .ln.sh{width:60px}
#prt .bx{display:inline-block;width:46px;height:22px;padding:0;border:1.5px solid #000;margin:2px 0}
#prt .fr i{background:#000}
#prt .pw{height:46px}
#prt .pa1{font-size:19px}#prt .pe{font-size:14px;color:#222;margin-top:4px}
#prt .pe .fr,#prt .pa1 .fr{font-size:.95em}
@media print{
 @page{size:A4;margin:14mm}
 html,body{background:#fff!important}
 body>*:not(#prt){display:none!important}
 #prt{position:static;overflow:visible;display:block!important}
 #prt .pbar,#prt .pbar *{display:none!important}
 #prt,#prt *{background-color:transparent!important}
 #prt .ps{max-width:none;padding:0;font-size:15px}
 #prt h1{font-size:20px}
 #prt .pw{height:40px}
}

<script>
// ---------- question generators (shared by app and answer-key export) ----------
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function gcd(a,b){return b?gcd(b,a%b):a}
function mk(seed){const r=mulberry32(seed);const R={ri:(a,b)=>a+Math.floor(r()*(b-a+1)),pick:a=>a[Math.floor(r()*a.length)]};R.shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};return R}
const fmt=x=>String(Number(Number(x).toFixed(6)));
const M=s=>'<span class="m" dir="ltr">'+s+'</span>';
const F=(n,d)=>'<span class="fr" dir="ltr"><b>'+n+'</b><i></i><b>'+d+'</b></span>';
const MX=(w,n,d)=>'<span class="mx" dir="ltr"><u>'+w+'</u>'+F(n,d)+'</span>';
const T=(a,b)=>fmt(a)+' '+b;
const things=['עוגיות','כדורים','קלפים','מדבקות','גולות','בלונים'];
function num(t,a,h,e){return{k:'num',t,a,h,e}}
function frac(t,n,d,h,e){return{k:'frac',t,a:[n,d],h,e}}
function mix(t,w,n,d,h,e){return{k:'mix',t,a:[w,n,d],h,e}}
function ch(t,opts,ai,h,e){return{k:'ch',t,opts,a:ai,h,e}}
function shuf(R,right,wrong){const o=R.shuffle([right].concat(wrong));return[o,o.indexOf(right)]}
// builders
const B={
digitVal(R,lv){const w=R.ri(1,9);let t=R.ri(1,9),h=lv?R.ri(1,9):0;const n=lv?w+'.'+t+h:w+'.'+t;const place=lv?R.pick(['t','h']):'t';
 const d=place==='t'?t:h;const val=place==='t'?d/10:d/100;const nm=place==='t'?'עשיריות':'מאיות';
 const [o,i]=shuf(R,fmt(val),[String(d),fmt(d*10),fmt(place==='t'?d/100:d/10)].filter((x,ix,ar)=>ar.indexOf(x)===ix&&x!==fmt(val)));
 return ch('מה ערך הספרה '+d+' במספר '+M(n)+'?',o,i,'הספרה '+d+' נמצאת במקום ה'+nm+'.','הספרה '+d+' נמצאת במקום ה'+nm+', לכן הערך שלה הוא '+M(fmt(val))+'.')},
compose(R,lv){const w=R.ri(1,9),t=R.ri(1,9);if(!lv)return num('כתוב כמספר עשרוני: '+w+' שלמים ו-'+t+' עשיריות',+(w+'.'+t),'השלמים לפני הנקודה, העשיריות אחריה.',M(w+'.'+t));
 const h=R.ri(1,9);return num('כתוב כמספר עשרוני: '+w+' שלמים, '+t+' עשיריות ו-'+h+' מאיות',+(w+'.'+t+h),'אחרי הנקודה: קודם עשיריות ואז מאיות.',M(w+'.'+t+h))},
cmp(R,lv){let a,b;if(lv===0){const w=R.ri(1,9);a=w+'.'+R.ri(1,4);b=w+'.'+R.ri(5,9)}else if(lv===1){a=R.ri(1,5)+'.'+R.ri(1,9);b=R.ri(6,9)+'.'+R.ri(1,9)}else{const w=R.ri(1,9);const x=R.ri(1,9);a=w+'.'+x;b=w+'.'+R.ri(0,x-1<0?0:x-1)+R.ri(1,9);if(+b>=+a)b=w+'.0'+R.ri(1,9)}
 const g=Math.max(+a,+b);const [o,i]=shuf(R,fmt(g),[fmt(Math.min(+a,+b))]);return ch('איזה מספר גדול יותר?',o,i,'משווים קודם את השלמים, אחר כך את העשיריות.',M(a)+' ו-'+M(b)+': הגדול הוא '+M(fmt(g))+'. משווים ספרה ספרה מהשמאל.')},
addDec(R,lv){let a,b,op='+';if(lv===0){a=R.ri(11,49)/10;b=R.ri(11,49)/10;while(((a*10)%10)+((b*10)%10)>=10){b=R.ri(11,49)/10}}else if(lv===1){a=R.ri(30,99)/10;b=R.ri(11,29)/10;op='-'}else{a=R.ri(120,990)/100;b=R.ri(110,290)/100;op=R.pick(['+','-'])}
 const r=op==='+'?a+b:a-b;return num('חשב: '+M(fmt(a)+' '+op+' '+fmt(b)),Math.round(r*100)/100,'כותבים בטור, נקודה מתחת לנקודה.','כותבים בטור כך שהנקודות אחת מתחת לשנייה. התוצאה: '+M(fmt(r)))},
tenp(R,lv){const n=R.pick([3.4,2.5,0.7,1.2,4.6,5.1,0.36,2.75,6.04]);const op=lv===0?R.pick(['*10','/10']):R.pick(['*100','/100','*1000','/10','*10']);const k=+op.slice(1);const r=op[0]==='*'?n*k:n/k;
 return num('חשב: '+M(fmt(n)+' '+(op[0]==='*'?'×':'÷')+' '+k),Math.round(r*1e6)/1e6,'כפל ב-10 מזיז את הנקודה ימינה, חילוק ב-10 מזיז שמאלה. כל אפס הוא צעד אחד.','כל אפס ב-'+k+' מזיז את הנקודה צעד אחד '+(op[0]==='*'?'ימינה':'שמאלה')+': '+M(fmt(r)))},
mul(R,lv){let a,b;if(lv===0){a=R.ri(11,24);b=R.ri(2,4)}else if(lv===1){a=R.ri(25,69);b=R.ri(3,8)}else if(lv===2){a=R.ri(12,35);b=R.ri(11,29)}else if(lv===3){a=R.ri(101,399);b=R.ri(12,29)}else{a=R.ri(1100,3499);b=R.ri(102,303)}
 return num('חשב: '+M(a+' × '+b),a*b,'כתוב בטור. כפול קודם את ספרת האחדות, אחר כך העשרות (שורה חדשה, מתחילים באפס), ובסוף חבר.','פותרים בטור: מכפילים כל ספרה, מחברים את השורות. '+M(a+' × '+b+' = '+(a*b)))},
div(R,lv){let d,q;if(lv===0){d=R.ri(2,5);q=R.ri(12,40)}else if(lv===1){d=R.ri(3,9);q=R.ri(40,190)}else if(lv===2){d=R.ri(11,19);q=R.ri(11,29)}else if(lv===3){d=R.ri(12,29);q=R.ri(30,99)}else{d=R.ri(12,29);q=R.ri(120,320)}
 return num('חשב: '+M((d*q)+' ÷ '+d),q,'חילוק ארוך: כמה פעמים '+d+' נכנס בספרות הראשונות? כתוב, הכפל, החסר, והורד ספרה.','בודקים בכפל: '+M(q+' × '+d+' = '+(d*q))+'. לכן '+M((d*q)+' ÷ '+d+' = '+q))},
share(R,lv){const d=R.ri(2,6),q=R.ri(lv?5:3,lv?12:8);const th=R.pick(things);return num(d+' ילדים מחלקים '+(d*q)+' '+th+' שווה בשווה. כמה '+th+' מקבל כל ילד?',q,'חילוק: '+M((d*q)+' ÷ '+d),'כל ילד מקבל '+M((d*q)+' ÷ '+d+' = '+q))},
pizza1(R,lv){const n=lv===0?R.ri(2,4):lv===1?R.ri(5,8):R.ri(9,12);return frac('מחלקים פיצה אחת שווה בשווה ל-'+n+' ילדים. איזה חלק מהפיצה מקבל כל ילד?',1,n,'מחלקים ל-'+n+' חלקים שווים. כל ילד מקבל חלק אחד מתוך '+n+'.','כל ילד מקבל חלק אחד מתוך '+n+': '+F(1,n)+'. כלומר '+M('1 ÷ '+n+' = ')+F(1,n))},
quot(R,lv){const b=R.ri(3,lv?12:7),a=R.ri(1,b-1);return frac('כתוב את תוצאת החילוק כשבר: '+M(a+' ÷ '+b),a,b,'המחולק (המספר הראשון) הוא המונה למעלה, המחלק הוא המכנה למטה.',M(a+' ÷ '+b+' = ')+F(a,b)+'. המספר הראשון למעלה והשני למטה.')},
readQ(R,lv){const b=R.ri(3,9),a=R.ri(1,b-1);const right=M(a+' ÷ '+b),[o,i]=shuf(R,right,[M(b+' ÷ '+a),M(a+' × '+b),M(a+' - '+b)]);return ch('השבר '+F(a,b)+' שווה לתוצאה של איזה חילוק?',o,i,'שבר הוא חילוק: המונה למעלה מחולק במכנה.',F(a,b)+' = '+M(a+' ÷ '+b))},
story(R,lv){const b=R.ri(3,8),a=R.ri(2,b-1);const th=R.pick(['פיצות','שוקולדים','עוגות','לחמניות']);return frac(a+' '+th+' מחולקות שווה בשווה ל-'+b+' ילדים. איזה חלק משלם מקבל כל ילד?',a,b,'מחלקים '+a+' ב-'+b+' וכותבים כשבר.',M(a+' ÷ '+b+' = ')+F(a,b)+'. כל ילד מקבל '+F(a,b)+' משלם.')},
big(R,lv){const b=R.ri(2,6),a=b*R.ri(1,2)+R.ri(1,b-1);const th=R.pick(['ליטר מים','ק"ג תפוחים','מטר חבל']);return frac(a+' '+th+' מחולקים שווה בשווה ל-'+b+' כלים. כמה בכל כלי? כתוב כשבר',a,b,'גם כשהמונה גדול מהמכנה כותבים: מחולק למעלה, מחלק למטה.',M(a+' ÷ '+b+' = ')+F(a,b)+'. השבר גדול מ-1 וזה בסדר גמור.')},
toMix(R,lv){const b=R.ri(2,6),w=R.ri(1,4),r=R.ri(1,b-1);const a=w*b+r;return mix('כתוב את '+F(a,b)+' כמספר מעורב',w,r,b,'כמה פעמים '+b+' נכנס ב-'+a+'? זה מספר השלמים. מה שנשאר הוא המונה.',F(a,b)+' = '+M(a+' ÷ '+b)+': יוצא '+w+' ושארית '+r+'. לכן '+MX(w,r,b))},
toImp(R,lv){const b=R.ri(2,6),w=R.ri(1,4),r=R.ri(1,b-1);return frac('כתוב את '+MX(w,r,b)+' כשבר',w*b+r,b,'כפול את השלמים במכנה והוסף את המונה: '+M(w+' × '+b+' + '+r),MX(w,r,b)+': '+M(w+' × '+b+' + '+r+' = '+(w*b+r))+', ולכן '+F(w*b+r,b))},
rem(R,lv){const b=R.ri(3,9),w=R.ri(1,lv?9:4),r=R.ri(1,b-1);const a=w*b+r;return mix('חשב '+M(a+' ÷ '+b)+' וכתוב את התוצאה כמספר מעורב',w,r,b,'קודם חילוק רגיל עם שארית. השארית הולכת למעלה, המחלק למטה.',M(a+' ÷ '+b)+': '+w+' ושארית '+r+'. תוצאה: '+MX(w,r,b))},
f2d(R,lv){const L=lv===0?[[1,2,.5],[1,10,.1],[3,10,.3],[1,4,.25],[3,4,.75],[1,5,.2]]:[[2,5,.4],[4,5,.8],[7,10,.7],[9,20,.45],[3,20,.15],[7,25,.28],[1,8,.125],[13,20,.65]];const x=R.pick(L);
 return num('כתוב כמספר עשרוני: '+F(x[0],x[1]),x[2],'חילוק: '+M(x[0]+' ÷ '+x[1])+'. או הרחב את המכנה ל-10 או ל-100.',F(x[0],x[1])+' = '+M(x[0]+' ÷ '+x[1]+' = '+fmt(x[2])))},
d2f(R,lv){const L=lv===0?[[.5,1,2],[.3,3,10],[.7,7,10],[.25,1,4],[.2,1,5],[.9,9,10]]:[[.75,3,4],[.6,3,5],[.4,2,5],[.35,7,20],[.45,9,20],[.8,4,5],[.15,3,20],[.04,1,25]];const x=R.pick(L);
 return frac('כתוב כשבר: '+M(fmt(x[0]))+' (אפשר גם בלי לצמצם)',x[1],x[2],'עשיריות: מכנה 10. מאיות: מכנה 100. אחר כך אפשר לצמצם.',M(fmt(x[0]))+' = '+F(x[1],x[2])+' אחרי צמצום.')},

function giladSnap(){
 const per={};

 const topics=TRACKS.map(([tr,title])=>{const ss=sets.filter(x=>x.tr===tr);const agg=k=>ss.reduce((a,x)=>a+x[k],0);const seenSets=ss.filter(x=>x.seen>0).length;return{id:tr,title,total:ss.length,seen:seenSets,wrong:agg('wrong'),tries:agg('tries'),hints:agg('hints'),acc:agg('seen')?Math.round((agg('seen')-agg('wrong'))/agg('seen')*100):null}});

 const wsc=qid=>(S.q.first[qid]===false?3:0)+(S.q.attempts[qid]||0)*2+(S.q.hints[qid]||0);
 const weak=Object.keys(S.q.first).filter(qid=>wsc(qid)>0).sort((a,b)=>wsc(b)-wsc(a)).slice(0,20)
  .map(qid=>({id:qid,set:qid.split(':')[0],topic:setOf(qid.split(':')[0]).n,text:S.q.text[qid]||'',wrong:S.q.first[qid]===false?1:0,tries:S.q.attempts[qid]||0,hints:S.q.hints[qid]||0}));

/* ---- personal plan: weak sets weighted, exact wrong questions first, then fresh ---- */
function giladPlan(s,max=12){
 const need=t=>t.wrong*3+t.tries*2+t.hints;
 let tg=(s.sets||[]).map(t=>({...t,need:need(t)})).filter(t=>t.need>0).sort((a,b)=>b.need-a.need).slice(0,5);
 let mode='weak';
 if(!tg.length){mode='fresh';tg=(s.sets||[]).filter(t=>!t.seen).slice(0,3);if(!tg.length)tg=(s.sets||[]).slice(0,3)}
 const wt=tg.map(t=>mode==='weak'?t.need:1),sum=wt.reduce((a,b)=>a+b,0)||1;
 const al=tg.map((t,i)=>Math.max(2,Math.floor(max*wt[i]/sum)));
 while(al.reduce((a,b)=>a+b,0)>max){const k=al.indexOf(Math.max(...al));if(al[k]<=2)break;al[k]--}
 while(al.reduce((a,b)=>a+b,0)<max){let k=0;wt.forEach((w,i)=>{if(w/al[i]>wt[k]/al[k])k=i});al[k]++}
 const jobs=[],alloc=[];
 tg.forEach((t,i)=>{
  const wq=(s.weak||[]).filter(w=>w.set===t.id).map(w=>{const p=w.id.split(':');return{set:p[0],v:+p[1],i:+p[2],sc:w.wrong*3+w.tries*2+w.hints}}).sort((a,b)=>b.sc-a.sc);
  const take=wq.slice(0,al[i]).map(x=>({set:x.set,v:x.v,i:x.i}));
  const v=500+Math.floor(Math.random()*400);
  for(let k=0;take.length<al[i]&&k<8;k++)take.push({set:t.id,v,i:k});
  take.forEach(x=>jobs.push(x));
  alloc.push({id:t.id,title:t.n,n:take.length,pct:Math.round(wt[i]/sum*100),wrong:t.wrong,hints:t.hints,acc:t.acc});
 });
 return{title:(mode==='weak'?'חיזוק אישי: ':'תרגול מאוזן: ')+tg.map(t=>t.n).join(' · '),jobs,alloc,mode};
}

function dailyRefs(){
 const k=dateKey(),r=mulberry32(dHash(k)),snap=giladSnap();
 const needMap=Object.fromEntries(snap.sets.map(x=>[x.id,x.wrong*3+x.tries*2+x.hints]));
 const bs=snap.sets.filter(x=>x.tr==='B'),bSeen=bs.reduce((a,x)=>a+x.seen,0),bWrong=bs.reduce((a,x)=>a+x.wrong,0);
 const bBoost=(!bSeen||(bSeen-bWrong)/bSeen<0.85)?2:1;
 const w=id=>(1+(needMap[id]||0))*(setOf(id).tr==='B'?bBoost:1);
 const oldIds=ORDER.filter(id=>!setOf(id).nw);
 const recent=(S.daily.used||[]).filter(x=>x.d!==k).slice(-3).flatMap(x=>x.ids);
 const fresh=snap.summary.answered===0;
 let pool=oldIds.filter(id=>!recent.includes(id));if(pool.length<8)pool=oldIds.slice();
 const take=(arr,n)=>{const out=[];while(out.length<n&&arr.length){let tot=arr.reduce((a,id)=>a+w(id),0),x=r()*tot,i=0;for(;i<arr.length;i++){x-=w(arr[i]);if(x<=0)break}i=Math.min(i,arr.length-1);out.push(arr.splice(i,1)[0])}return out};
 let oldPick;
 if(fresh){const u=oldIds.filter(id=>!S.done[id]).slice(0,3);while(u.length<3)u.push(oldIds[u.length]);oldPick=[u[0],u[0],u[1],u[1],u[2],u[2]]}
 else{
  const sorted=pool.slice().sort((a,b)=>w(b)-w(a));
  const focus=sorted.slice(0,2),rest=take(sorted.slice(2),2);
  oldPick=[focus[0],focus[0],focus[1],focus[1],...rest].filter(Boolean).slice(0,6);
  while(oldPick.length<6)oldPick.push(pool[Math.floor(r()*pool.length)]);
 }
 const newIds=ORDER.filter(id=>setOf(id).nw&&!S.done[id]).slice(0,2);
 let newPick=(!testMode()&&newIds.length)?[newIds[0],newIds[0],newIds[1]||newIds[0],newIds[1]||newIds[0]]:take(pool.slice(),4);
 const v=dHash(k)%900;
 const win=Math.min(3,Math.floor((S.daily.streak||0)/3)),lo=1+win,hi=4+win;
 const all=[...oldPick.map(id=>({set:id,v,nw:0})),...newPick.map((id,j)=>({set:id,v:(v+j)%900,nw:1}))];
 all.forEach((x,q)=>{x.i=Math.min(7,lo+Math.floor((hi-lo+1)*q/10));if(x.nw)x.i=Math.min(x.i,lo+1)});

 all.sort((a,b)=>a.i-b.i);
 return all;
}

<script>
/* Parent progress telemetry: opt-in on Gilad's device, no visitor tracking by default. */
(()=>{
  const APP='גלעדיקה', URL='https://script.google.com/macros/s/AKfycbwlq3_queCzhjr_tVXN7BlsHR1_IK94c3BKra-G2mbI2TbJMhqNYXwZFSPj-kiNpT1NdQ/exec';
  const KEY='gilad-tracking-v1';
  const code=()=>localStorage.getItem(KEY)||'';
  const consent=()=>code().length===32;
  let mode='other', topic='', since=Date.now(), started=false;
  const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,10);
  const post=(e)=>{
    if(!consent() || !URL || URL.includes('__ENDPOINT__'))return;
    const payload=JSON.stringify({v:1,code:code(),app:APP,at:new Date().toISOString(),id:id(),...e});
    try{ if(navigator.sendBeacon && navigator.sendBeacon(URL,new Blob([payload],{type:'text/plain'})))return;
      fetch(URL,{method:'POST',mode:'no-cors',keepalive:true,headers:{'Content-Type':'text/plain'},body:payload}).catch(()=>{});
    }catch(_){}
  };
  const flush=()=>{if(!consent())return;let now=Date.now(), seconds=Math.min(300,Math.max(0,Math.round((now-since)/1000)));
    if(seconds>0 && started)post({type:'time',mode,topic,seconds});since=now;
  };
  const activate=()=>{if(!consent()||document.hidden)return;since=Date.now();if(!started){started=true;post({type:'session_open'});}};
  const deactivate=()=>{if(!started)return;flush();post({type:'session_close'});started=false};
  window.giladTrack={
    mode:(m,t)=>{if(!consent())return;flush();mode=m;topic=t||'';since=Date.now()},
    milestone:(type,detail={})=>post({type,...detail}),
    enabled:consent
  };
  window.addEventListener('DOMContentLoaded',()=>{
    const btn=document.createElement('button');btn.type='button';btn.id='trackingToggle';
    btn.textContent=consent()?'מעקב לגלעד: פעיל · לחצו לכיבוי':'הפעלת מעקב לימוד לגלעד';
    btn.style.cssText='position:fixed;bottom:12px;left:12px;z-index:1000;padding:9px 12px;border-radius:12px;border:1px solid #87b7a6;background:#eefaf3;color:#123c35;font:600 13px Arial;max-width:230px;cursor:pointer';
    btn.title='הנתונים על שימוש, זמן וציונים נשלחים לגיליון הפרטי של מיקי בחשבון Google שלו';
    btn.onclick=()=>{if(consent()){
      if(confirm('לכבות מעקב במכשיר זה?')){deactivate();localStorage.removeItem(KEY);btn.textContent='הפעלת מעקב לימוד לגלעד'}
    }else if(confirm('להפעיל מעקב במכשיר של גלעד? זמני שימוש לפי מצב, נושאים וציונים יישלחו לגיליון הפרטי של מיקי ב-Google ולמצב מורה (סיכום התקדמות עדכני בשרת פרטי). אין להפעיל במכשיר של תלמיד אחר.')){
      const entered=prompt('קוד ההפעלה מופיע בלשונית הסבר בגיליון הפרטי של מיקי:');
      if(!entered || !/^[a-f0-9]{32}$/i.test(entered.trim()))return;
      localStorage.setItem(KEY,entered.trim());btn.textContent='מעקב לגלעד: פעיל · לחצו לכיבוי';activate();
    }};document.body.append(btn);activate();
  });
  document.addEventListener('visibilitychange',()=>document.hidden?deactivate():activate());
  window.addEventListener('pagehide',deactivate);
  setInterval(()=>{if(started&&!document.hidden)flush()},60000);
})();

  /* ---- gamification: streak, points, daily 10-minute goal ---- */

  function gameSnap(){const g=rdG(),t=g.days[f2(new Date())]||{secs:0,ans:0,ok:0},days=[];for(let i=0;i<14;i++){const d=new Date();d.setDate(d.getDate()-i);const x=g.days[f2(d)];days.push({d:f2(d),m:x?Math.floor(x.secs/60):0})}return{streak:streakOf(g),points:g.points,level:levelOf(g.points),today:{m:Math.floor(t.secs/60),goal:GOAL/60,ans:t.ans,ok:t.ok},days}}

  function openGame(){const s=gameSnap(),pct=Math.min(100,Math.round(s.today.m/s.today.goal*100)),lv=s.level,toNext=150-(s.points%150);

<script>
/* Hebrew label pairs like "ציור:מציאות" stay together so neighbouring numbers cannot flip them. */
(()=>{const re=/[\u0590-\u05ff]+:[\u0590-\u05ff]+/g,SK='script,style,textarea,input,select,option,svg,bdi';
function wrap(root){const ns=[];if(root.nodeType===3)ns.push(root);else if(root.nodeType===1){const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);while(w.nextNode())ns.push(w.currentNode)}
for(const n of ns){const p=n.parentElement;if(!p||p.closest(SK))continue;const v=n.nodeValue;re.lastIndex=0;if(!re.test(v))continue;re.lastIndex=0;const f=document.createDocumentFragment();let last=0;
for(const m of v.matchAll(re)){f.append(v.slice(last,m.index));const b=document.createElement('bdi');b.dir='rtl';b.textContent=m[0];f.append(b);last=m.index+m[0].length}
f.append(v.slice(last));n.replaceWith(f)}}
wrap(document.body);new MutationObserver(rs=>{for(const r of rs){if(r.type==='characterData')wrap(r.target);else for(const n of r.addedNodes)wrap(n)}}).observe(document.body,{childList:true,subtree:true,characterData:true});})();
</script>
